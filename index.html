<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
  <!-- PeerJS for Online P2P Multiplayer -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Canvas Confetti for Win Animation -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div class="container">
    <!-- TOP HEADER -->
    <header class="top-bar">
      <button id="backBtn" class="nav-btn" onclick="goBack()" style="visibility: hidden;">&larr; BACK</button>
      <h1 class="logo">TIC TAC TOE</h1>
      <div style="width: 70px;"></div> <!-- Spacing alignment -->
    </header>

    <!-- MENU SCREEN -->
    <div id="menuScreen" class="screen active">
      <div class="user-profile-section">
        <label for="usernameInput">ENTER YOUR NAME:</label>
        <input type="text" id="usernameInput" placeholder="PLAYER 1" maxlength="12" />
      </div>

      <div class="menu-grid">
        <button class="menu-card" onclick="startPassAndPlay()">
          <span class="icon">👥</span>
          <span class="title">PASS & PLAY</span>
          <span class="desc">Play locally with a friend</span>
        </button>

        <button class="menu-card" onclick="openAIScreen()">
          <span class="icon">🤖</span>
          <span class="title">VS AI MODE</span>
          <span class="desc">Challenge the computer</span>
        </button>

        <button class="menu-card" onclick="startOnlinePVP()">
          <span class="icon">🌐</span>
          <span class="title">ONLINE PVP</span>
          <span class="desc">Match with online players</span>
        </button>

        <button class="menu-card" onclick="openSandboxScreen()">
          <span class="icon">🛠️</span>
          <span class="title">SANDBOX MODE</span>
          <span class="desc">Create custom room & join</span>
        </button>
      </div>
    </div>

    <!-- AI MODE SELECTION SCREEN -->
    <div id="aiScreen" class="screen">
      <h2>SELECT AI DIFFICULTY</h2>
      <div class="diff-buttons">
        <button class="btn diff-btn easy" onclick="startAIMode('easy')">EASY</button>
        <button class="btn diff-btn medium" onclick="startAIMode('medium')">MEDIUM</button>
        <button class="btn diff-btn hard" onclick="startAIMode('hard')">HARD</button>
        <button class="btn diff-btn extreme" onclick="startAIMode('extreme')">EXTREME</button>
      </div>
    </div>

    <!-- SANDBOX / CUSTOM ROOM SCREEN -->
    <div id="sandboxScreen" class="screen">
      <h2>SANDBOX ROOMS</h2>
      <div class="sandbox-actions">
        <button class="btn" onclick="createCustomRoom()">CREATE CUSTOM ROOM</button>
        <div class="join-box">
          <input type="text" id="roomCodeInput" placeholder="ENTER ROOM CODE" maxlength="10" />
          <button class="btn btn-join" onclick="joinCustomRoom()">JOIN ROOM</button>
        </div>
      </div>
    </div>

    <!-- PVP MATCHMAKING SCREEN -->
    <div id="pvpScreen" class="screen">
      <div class="pvp-status">
        <div class="spinner" id="pvpStatusSpinner"></div>
        <h2 id="pvpStatusText">SEARCHING MATCH...</h2>
        <p id="pvpStatusDetail">Connecting to online matchmaking servers</p>
        <button class="btn btn-secondary" onclick="cancelPVP()">CANCEL</button>
      </div>
    </div>

    <!-- GAME BOARD SCREEN -->
    <div id="gameScreen" class="screen">
      <div class="scoreboard">
        <div class="player-box active" id="p1Box">
          <span class="player-name" id="p1Name">PLAYER 1</span>
          <span class="player-score" id="p1Score">0</span>
        </div>
        <div class="vs-divider">VS</div>
        <div class="player-box" id="p2Box">
          <span class="player-name" id="p2Name">PLAYER 2</span>
          <span class="player-score" id="p2Score">0</span>
        </div>
      </div>

      <div class="round-banner" id="roundBanner">ROUND 1</div>

      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
    </div>
  </div>

  <!-- WINNER / LOSER MODAL -->
  <div id="winnerModal" class="modal">
    <div class="modal-content">
      <h2 id="winnerTitle">CONGRATULATIONS!</h2>
      <p id="winnerSubtext">🎉 YOU WIN THE MATCH!</p>
      <div class="modal-actions">
        <button class="btn" onclick="replayGame()">PLAY AGAIN</button>
        <button class="btn btn-secondary" onclick="exitToMenuFromModal()">BACK TO MENU</button>
      </div>
    </div>
  </div>

  <!-- WAITING / ALERT MODAL -->
  <div id="waitingModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle">ROOM CREATED!</h2>
      <div class="code-display" id="modalCodeDisplay">---</div>
      <button class="btn btn-secondary" onclick="closeModal('waitingModal')">CANCEL</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
